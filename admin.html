<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | معرض Crazy Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <div id="loginScreen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-gray-200">
            <div class="text-center mb-8">
                <span class="text-3xl font-black text-blue-900 tracking-wider">CRAZY CAR</span>
                <p class="text-gray-500 text-sm mt-1">تسجيل دخول لوحة تحكم الأدمن</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3">
                </div>
                <p id="loginError" class="text-red-600 text-xs hidden font-bold">خطأ في البيانات!</p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition">دخول</button>
            </form>
        </div>
    </div>

    <div id="adminDashboard" class="hidden">
        <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <span class="text-xl font-black text-blue-900">⚡ لوحة تحكم Crazy Car (عبد العزيز بدر)</span>
                <button onclick="loadBookings()" class="bg-gray-50 hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-xl text-sm font-bold border border-gray-300">
                    <i class="fa-solid fa-rotate"></i> تحديث البيانات
                </button>
            </div>
        </header>

        <main class="container mx-auto px-6 py-10">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-xl font-black text-gray-900">طلبات وحجوزات العملاء المباشرة من الشيت</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs font-bold border-b border-gray-200">
                                <th class="p-4">رقم الحجز والتاريخ</th>
                                <th class="p-4">العميل ورقم الهاتف</th>
                                <th class="p-4">السيارة والنوع</th>
                                <th class="p-4">المقدم</th>
                                <th class="p-4">محفظة فودافون كاش</th>
                                <th class="p-4 text-center">الإيصال</th>
                                <th class="p-4 text-center">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody" class="divide-y divide-gray-100 text-sm">
                            <tr><td colspan="7" class="p-8 text-center text-gray-400 font-semibold">جاري جلب الطلبات من السيرفر...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="receiptModal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-4 rounded-3xl max-w-lg w-full relative text-center">
            <button onclick="closeReceiptModal()" class="absolute top-4 left-4 text-gray-500 text-2xl font-bold">&times;</button>
            <h3 class="font-black text-lg mb-3 text-blue-900">إيصال تحويل فودافون كاش</h3>
            <img id="modalReceiptImg" src="" class="w-full max-h-[70vh] object-contain rounded-xl border">
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysadv86DPeZV2EiZjXgsF-FnI-3XGMS5yVCmZq7tytAqHAA5WOnQ_I4YbLQVgw-npLUg/exec";
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "crazycar2026";

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('is_admin_logged') === 'true') {
                showDashboard();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('username').value === ADMIN_USER && document.getElementById('password').value === ADMIN_PASS) {
                sessionStorage.setItem('is_admin_logged', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadBookings();
        }

        function loadBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400 font-semibold">جاري التحديث...</td></tr>`;

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    tbody.innerHTML = '';
                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400 font-semibold">لا توجد حجوزات حتى الآن.</td></tr>`;
                        return;
                    }

                    data.forEach(b => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-4 font-bold text-gray-900">${b.id || ''}<br><span class="text-xs text-gray-400">${b.date || ''}</span></td>
                                <td class="p-4"><span class="font-bold block">${b.name || ''}</span><a href="https://wa.me/${b.phone}" target="_blank" class="text-emerald-600 text-xs font-semibold"><i class="fa-brands fa-whatsapp"></i> ${b.phone || ''}</a></td>
                                <td class="p-4"><span class="font-bold block">${b.car || ''}</span><span class="text-xs text-gray-500">${b.type || ''}</span></td>
                                <td class="p-4 font-black text-blue-600">${b.price || ''} ج.م</td>
                                <td class="p-4 font-mono text-gray-600" dir="ltr">${b.wallet || ''}</td>
                                <td class="p-4 text-center">
                                    <button onclick="openReceiptModal('${b.receipt || ''}')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold">
                                        <i class="fa-solid fa-image"></i> عرض الإيصال
                                    </button>
                                </td>
                                <td class="p-4 text-center"><span class="bg-amber-50 text-amber-600 px-3 py-1 rounded-full text-xs font-bold border border-amber-200">${b.status || 'قيد المراجعة'}</span></td>
                            </tr>
                        `;
                    });
                })
                .catch(() => {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 font-semibold">خطأ في جلب البيانات من السيرفر.</td></tr>`;
                });
        }

        function openReceiptModal(url) {
            document.getElementById('modalReceiptImg').src = url;
            document.getElementById('receiptModal').classList.remove('hidden');
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').classList.add('hidden');
        }
    </script>
</body>
</html>
